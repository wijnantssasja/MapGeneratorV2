{% extends "base.html" %}
{% block title %}Wachtwoord Wijzigen - Rode Kruis Map Generator{% endblock %}

{% block content %}
<div class="content" style="max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color: #d32f2f; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">Wachtwoord Wijzigen</h2>
    
    <p style="color: #555; font-size: 14px; margin-bottom: 20px;">
        Kies een sterk nieuw wachtwoord om je account <b>{{ user.username }}</b> te beveiligen.
    </p>

    {% if error %}
    <div style="background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #ef9a9a;">
        <b>Fout:</b> {{ error }}
    </div>
    {% endif %}

    <form action="/profile/change-password" method="POST">
        <div class="form-group" style="margin-bottom: 15px;">
            <label for="current_password" style="font-weight: bold; display: block; margin-bottom: 5px;">Huidig Wachtwoord:</label>
            <input type="password" id="current_password" name="current_password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        
        <div class="form-group" style="margin-bottom: 25px;">
            <label for="new_password" style="font-weight: bold; display: block; margin-bottom: 5px;">Nieuw Wachtwoord:</label>
            <input type="password" id="new_password" name="new_password" required minlength="6" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="color: #777; text-decoration: none; font-weight: bold;">Annuleren</a>
            <button type="submit" style="background-color: #1976d2; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">Wachtwoord Opslaan</button>
        </div>
    </form>
</div>
{% endblock %}
