{% extends "base.html" %}
{% block title %}Veiligheidsupdate - Rode Kruis Map Generator{% endblock %}

{% block content %}
<div class="content" style="max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #d32f2f;">
    <h2 style="color: #d32f2f; margin-top: 0;">Actie Vereist</h2>

    <div style="background-color: #fff3e0; color: #e65100; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 4px solid #ff9800;">
        <strong>Welkom, {{ user.username }}!</strong><br>
        Een beheerder heeft ingesteld dat je om veiligheidsredenen je wachtwoord moet wijzigen voordat je verder kunt gaan.
    </div>

    <form action="/profile/force-password-change" method="POST">
        <div class="form-group" style="margin-bottom: 25px;">
            <label for="new_password" style="font-weight: bold; display: block; margin-bottom: 5px;">Kies een Nieuw Wachtwoord:</label>
            <input type="password" id="new_password" name="new_password" required minlength="6" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="Minimaal 6 tekens...">
        </div>

        <button type="submit" style="width: 100%; background-color: #4CAF50; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer;">
            Opslaan & Doorgaan
        </button>
    </form>
</div>

<!-- Verberg het hoofdmenu zolang ze hun wachtwoord niet hebben gewijzigd -->
<style>
    .navbar { display: none !important; }
</style>
{% endblock %}
